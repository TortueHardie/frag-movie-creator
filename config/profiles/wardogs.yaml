id: wardogs
displayName: Wardogs

match:
  pathContains: ["Wardogs", "War Dogs"]
  priority: 10

window: { size: 1s, hop: 500ms }

# Pistes Outplayed (mesuré) : a:0 = mix jeu + voix, a:1 = jeu seul, a:2 = micro seul.
detectors:
  # Intensité sonore du jeu : combats, explosions. maxValue > 1 garde un classement entre les moments très bruyants.
  - id: game-audio
    type: audio-loudness
    weight: 0.6
    normalization: { lowPercentile: 0.5, highPercentile: 0.995, minSpread: 10, maxValue: 1.3 }
    params: { stream: 1, fallbackStream: 0, localBaseline: 20s }

  # Voix : poids faible, parler ne suffit pas à faire un bon moment.
  - id: mic-audio
    type: audio-loudness
    weight: 0.1
    normalization: { lowPercentile: 0.8, highPercentile: 0.995, minSpread: 12 }
    params: { stream: 2, optional: true }

  # Notifications du jeu au centre de l'écran (~4 s) : kill (tête de mort), assistance (poignée de main),
  # réanimation (battement de cœur). Seuls les pixels clairs de l'icône sont comparés (le décor derrière change).
  # Le jeu affiche la notification en taille normale ou agrandie (×1,35) : les deux sont cherchées.
  # Calibré sur 38 images réelles étiquetées : kills 0,91-1,00 (autres ≤ 0,72) ; assistances 0,75-1,00 (autres ≤ 0,68) ;
  # réanimations 0,80-1,00 (autres ≤ 0,45).
  - id: notifications
    type: hud-template
    weight: 0
    eventBoosts: { kill: 0.8, assist: 0.3, revive: 0.3 }
    params:
      mode: events
      referenceHeight: 1440
      # Les trois icônes apparaissent au même endroit : seule la plus ressemblante compte sur chaque image.
      exclusive: true
      templates:
        - name: kill-icon
          kind: kill
          file: templates/wardogs/kill_skull.png
          method: bright
          brightness: 200
          scales: [1.0, 1.35]
          region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
          threshold: 0.8
          minConsecutive: 1
        - name: assist-icon
          kind: assist
          file: templates/wardogs/assist_hand.png
          method: bright
          brightness: 200
          scales: [1.0, 1.35]
          region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
          threshold: 0.72
          minConsecutive: 1
        - name: revive-icon-large
          kind: revive
          file: templates/wardogs/revive_heart.png
          method: bright
          brightness: 200
          scales: [1.0]
          region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
          threshold: 0.7
          minConsecutive: 1
        - name: revive-icon
          kind: revive
          file: templates/wardogs/revive_heart_small.png
          method: bright
          brightness: 200
          scales: [1.0]
          region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
          threshold: 0.7
          minConsecutive: 1

  # En jeu ou non : le cœur de la barre de vie est absent des menus et écrans de chargement → score annulé.
  - id: in-game
    type: hud-template
    role: gate
    params:
      mode: presence
      presenceHold: 8s
      templates:
        - name: hud-heart
          file: templates/wardogs/hud_heart.png
          region: { x: 0.951744, y: 0.9375, width: 0.016860, height: 0.027778 }
          threshold: 0.7

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { stream: 2, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { stream: 2, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 4s
  preRoll: 4s
  postRoll: 2s
  minClip: 4s
  maxClip: 20s
  target: { totalDuration: 60s }

edit:
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  # Montage : piste mix uniquement (les autres la composent déjà).
  audioStreams: [0]
  # source = ratio de la capture (3440x1440 → 2580x1080).
  formats: ["source", "9:16"]
  sourceHeight: 1080
  vertical:
    size: { width: 1080, height: 1920 }
    # Zones mesurées sur une capture 3440x1440 (coordonnées normalisées, valables quelle que soit la résolution
    # tant que l'échelle du HUD ne change pas). Réglage : bouton « 9:16 » dans l'application.
    hud:
      - name: killfeed
        source: { x: 0.008, y: 0.445, width: 0.13, height: 0.12 }
        target: { x: 0.02, y: 0.07, width: 0.60 }
      - name: minimap
        source: { x: 0.010, y: 0.683, width: 0.105, height: 0.28 }
        target: { x: 0.02, y: 0.70, width: 0.34 }
      - name: status
        source: { x: 0.892, y: 0.830, width: 0.103, height: 0.135 }
        target: { x: 0.62, y: 0.74, width: 0.36 }
