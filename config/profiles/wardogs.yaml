id: wardogs
displayName: Wardogs

match:
  pathContains: ["Wardogs", "War Dogs"]
  priority: 10

window: { size: 1s, hop: 500ms }

# Les pistes sont désignées par leur rôle : Outplayed en écrit trois (mix, jeu, micro), OBS une ou deux, et le bon
# choix se fait tout seul. Pour imposer des index : « audio: { game: 1, mic: 2 } » au niveau du profil.
detectors:
  # Intensité sonore du jeu : combats, explosions. maxValue > 1 garde un classement entre les moments très bruyants.
  - id: game-audio
    type: audio-loudness
    weight: 0.6
    normalization: { lowPercentile: 0.5, highPercentile: 0.995, minSpread: 10, maxValue: 1.3 }
    params: { role: game, localBaseline: 20s }

  # Voix : poids faible, parler ne suffit pas à faire un bon moment.
  - id: mic-audio
    type: audio-loudness
    weight: 0.1
    normalization: { lowPercentile: 0.8, highPercentile: 0.995, minSpread: 12 }
    params: { role: mic, optional: true }

  # Kills, aides et réanimations lus dans le journal des gains (en haut à droite : « ÉLIMINATION +$1500 »,
  # « AIDE : ÉLIMINATION », « COÉQUIPIER RÉANIMÉ 250XP »…) par l'OCR de Windows, fusionnés avec les icônes de
  # notification au centre de l'écran. Le journal donne le type (une « Aide : Élimination » affiche la même tête de mort
  # qu'un kill) et sépare les kills enchaînés ; l'icône date l'événement et couvre le texte illisible sur ciel clair.
  # Mesuré sur une partie de 1 h 25 (tableau de fin : 14 éliminations, 3 aides, 10 réanimations) : 14 kills, 3 aides,
  # 9 réanimations, aucun faux positif. Les icônes seules donnaient 12 kills (+1 faux), 0 aide, 4 réanimations.
  - id: game-events
    type: ocr-log
    weight: 0
    eventBoosts: { kill: 0.8, assist: 0.3, revive: 0.3 }
    params:
      # Journal mesuré sur 3840x1606 (même format que 3440x1440), sous le compteur d'argent : jusqu'à 8 lignes.
      # referenceWidth/Height donnent le format de cette capture : la zone est recalculée pour un écran 16:9 ou autre,
      # le journal restant collé au bord droit et sa taille suivant la hauteur de l'image.
      region: { x: 0.786458, y: 0.037360, width: 0.208333, height: 0.186800 }
      referenceHeight: 1606
      referenceWidth: 3840
      anchor: right
      # Langue de l'OCR et libellés : ceux du jeu en français. Pour une autre langue, remplacer « language » par la
      # langue du jeu (ex. en-US) et ajouter ses libellés aux règles, sans espaces ni accents (ex. KILLASSIST).
      language: fr-FR
      rules:
        # Lignes à ignorer d'abord : elles contiennent des mots des règles suivantes. « AIDE : VÉHICULE DE SECTION
        # DÉTRUIT » est une pénalité (montant négatif), pas une aide ; « CIBLE REPÉRÉE DÉTRUITE » un bonus d'XP.
        - match: [REPEREE, SOIGNE, JOUEURREANIME, ATTENTEDEREANIMATION, VEHICULEDESECTION, PRESENCE, POTDEVIN]
        - kind: assist
          match: [AIDEELIMINATION, AIDEVEHICULEDETRUIT]
        - kind: kill
          match: [ELIMINATION, SHUTDOWNKILL, TIRALATETE]
        - kind: revive
          match: [COEQUIPIERREANIME, EQUIPIERREANIM]
      # Icônes au centre de l'écran (~4 s) : kill (tête de mort, aussi affichée pour une aide à l'élimination), aide
      # (poignée de main : « aide à l'élimination repérée », absente du journal), réanimation (battement de cœur).
      # Seuls les pixels clairs de l'icône sont comparés ; taille normale ou agrandie (×1,35).
      icons:
        mode: events
        referenceHeight: 1440
        # Format de la capture de référence : les zones suivent celui de la capture analysée.
        referenceWidth: 3440
        # Les trois icônes apparaissent au même endroit : seule la plus ressemblante compte sur chaque image.
        exclusive: true
        templates:
          - name: kill-icon
            kind: kill
            file: templates/wardogs/kill_skull.png
            method: bright
            brightness: 200
            scales: [1.0, 1.35]
            region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
            anchor: center
            threshold: 0.8
            minConsecutive: 1
          - name: assist-icon
            kind: assist
            file: templates/wardogs/assist_hand.png
            method: bright
            brightness: 200
            scales: [1.0, 1.35]
            region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
            anchor: center
            threshold: 0.72
            minConsecutive: 1
          - name: revive-icon-large
            kind: revive
            file: templates/wardogs/revive_heart.png
            method: bright
            brightness: 200
            scales: [1.0]
            region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
            anchor: center
            threshold: 0.7
            minConsecutive: 1
          - name: revive-icon
            kind: revive
            file: templates/wardogs/revive_heart_small.png
            method: bright
            brightness: 200
            scales: [1.0]
            region: { x: 0.482558, y: 0.621528, width: 0.034884, height: 0.076389 }
            anchor: center
            threshold: 0.7
            minConsecutive: 1

  # En jeu ou non : le cœur de la barre de vie est absent des menus et écrans de chargement → score annulé.
  - id: in-game
    type: hud-template
    role: gate
    params:
      mode: presence
      presenceHold: 8s
      referenceHeight: 1440
      referenceWidth: 3440
      templates:
        - name: hud-heart
          file: templates/wardogs/hud_heart.png
          region: { x: 0.951744, y: 0.9375, width: 0.016860, height: 0.027778 }
          anchor: right
          threshold: 0.7
          # Écran noir (chargement, fondu, mort) : sans forme à reconnaître, la corrélation ne mesure que le
          # dégradé du fond et monte jusqu'à 0,74, au-dessus du seuil. Mesuré sur 401 images de deux captures
          # (3440x1440 et 3840x1606) : HUD visible → contraste 23 à 63 ; écran noir → 4,6 à 5,8.
          minContrast: 15

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { role: mic, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { role: mic, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 4s
  preRoll: 4s
  postRoll: 2s
  minClip: 4s
  maxClip: 20s
  target: { totalDuration: 60s }

edit:
  # story : montage façon YouTube (temps morts coupés en jump cuts, accroche du meilleur moment en ouverture,
  # punch-in sur les rires et cris, secousse sur les kills, flash + whoosh entre les moments).
  # simple : les moments bout à bout, séparés par un fondu.
  style: story
  story:
    jumpCuts: { minGap: 1500ms, breath: 300ms, deadScore: 0.35, alternateZoom: 1.08 }
    coldOpen: { enabled: true, length: 3s }
    punchIn: { amount: 0.15, on: [laughter, shout] }
    shake: { amplitude: 0.012, events: [kill] }
    sfx: { enabled: true, whooshVolume: 0.35, impactVolume: 0.5 }
    # Sous-titres de la voix (micro), transcrite en local par whisper.cpp. Sans le modèle, le montage sort sans
    # sous-titres. Modèle : https://huggingface.co/ggerganov/whisper.cpp (ggml-large-v3-turbo-q5_0.bin, ~574 Mo).
    captions: { model: models/ggml-large-v3-turbo-q5_0.bin, language: fr, maxChars: 18 }
    # Musique de fond facultative (chemin relatif au dossier de configuration), baissée sous la voix et coupée sur
    # le pic de chaque moment : music: { file: musique/fond.mp3, volume: 0.25 }
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  # Son du montage : tout le son de la capture, sans doubler une piste qui contient déjà les autres.
  audio: mix
  # source = ratio de la capture (3440x1440 → 2580x1080).
  formats: ["source", "9:16"]
  sourceHeight: 1080
  vertical:
    size: { width: 1080, height: 1920 }
    # Zones mesurées sur une capture 3440x1440 : « reference » donne ce format, et elles sont converties pour une
    # capture d'un autre format (16:9…). Réglage : bouton « 9:16 » dans l'application.
    reference: { width: 3440, height: 1440 }
    hud:
      - name: killfeed
        source: { x: 0.008, y: 0.445, width: 0.13, height: 0.12 }
        target: { x: 0.02, y: 0.07, width: 0.60 }
      - name: minimap
        source: { x: 0.010, y: 0.683, width: 0.105, height: 0.28 }
        target: { x: 0.02, y: 0.70, width: 0.34 }
      - name: status
        source: { x: 0.892, y: 0.830, width: 0.103, height: 0.135 }
        target: { x: 0.62, y: 0.74, width: 0.36 }
