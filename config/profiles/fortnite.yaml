id: fortnite
displayName: Fortnite

match:
  pathContains: ["Fortnite"]
  priority: 10

window: { size: 1s, hop: 500ms }

# Réglé sur une seule vidéo : « 81 Elimination Squads Zero Build Fortnite.mp4 » (YouTube, 854x480 30 img/s, une seule
# piste son, trois parties en escouade montées bout à bout, HUD par défaut). Les zones et les modèles sont mesurés sur
# cette image 480p (reference 854x480) : une capture 1080p y est ramenée avant la comparaison. Un HUD déplacé dans les
# options du jeu, ou une capture d'une autre définition, n'est pas vérifié.
detectors:
  # Intensité sonore du jeu : combats, explosions.
  - id: game-audio
    type: audio-loudness
    weight: 0.6
    normalization: { lowPercentile: 0.5, highPercentile: 0.995, minSpread: 10, maxValue: 1.3 }
    params: { role: game, localBaseline: 20s }

  - id: mic-audio
    type: audio-loudness
    weight: 0.1
    normalization: { lowPercentile: 0.8, highPercentile: 0.995, minSpread: 12 }
    params: { role: mic, optional: true }

  # Adversaire mis à terre (« KNOCKED! » au centre, 1,5 s) : c'est le kill du montage (choix du joueur : « mettre à
  # terre, c'est le kill, pas achever »). Lu 4 fois par seconde : aucun score entre 0,6 et 0,75 sur la vidéo de réglage.
  - id: knocks
    type: hud-template
    weight: 0
    params:
      mode: events
      referenceWidth: 854
      referenceHeight: 480
      sampling: fps
      fps: 4
      templates:
        - name: knocked
          kind: knock
          file: templates/fortnite/knocked.png
          region: { x: 0.437939, y: 0.704167, width: 0.131148, height: 0.083333 }
          anchor: center
          threshold: 0.75
          minConsecutive: 2
          gap: 2s

  # Éliminations du joueur : le compteur personnel en haut à droite (tête de mort, au-dessus de celui de l'escouade),
  # lu deux fois par seconde et décodé en une suite croissante remise à zéro à chaque partie. Sur la vidéo de réglage
  # (titre « 81 éliminations » : c'est le total de l'escouade), le compteur finit les trois parties à 11, 13 et 7 :
  # 31 éliminations du joueur (« elimination »), toutes trouvées, aucune en trop. L'OCR de Windows ne lit rien à cette
  # définition (journal d'XP et notification « ÉLIMINATION! » de 7 px de haut).
  # Le kill (« kill ») est la mise à terre que l'élimination achève (rattachement sur 30 s, voir KnockPairing) ; une
  # élimination sans mise à terre avant reste un kill à son instant ; une équipe entière éliminée d'un coup reste un
  # multi-kill à l'instant du compteur ; une mise à terre jamais créditée reste un kill. Mesuré : 33 kills.
  - id: game-events
    type: hud-counter
    dependsOn: [knocks]
    weight: 0
    eventBoosts: { kill: 0.8 }
    params:
      region: { x: 0.819672, y: 0.029167, width: 0.023419, height: 0.025 }
      referenceWidth: 854
      referenceHeight: 480
      anchor: right
      digits: templates/fortnite
      kind: kill
      knocks: { kind: knock, window: 30s }

  - id: voice
    type: voice-activity
    weight: 0
    params: { role: mic, optional: true, silenceDb: -50 }

  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { role: mic, optional: true }

selection:
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 4s
  preRoll: 4s
  postRoll: 2s
  minClip: 4s
  maxClip: 20s
  target: { totalDuration: 60s }

edit:
  # Webcam en incrustation (16:9, format source) : coin libre du HUD ; mini-carte en haut à droite, vie en bas à gauche, inventaire en bas à droite : le haut gauche n'a que les quêtes.
  webcam: { corner: top-left }
  style: story
  story:
    scenes: { gap: 10s, maxLength: 30s }
    jumpCuts: { minGap: 1500ms, breath: 300ms, deadScore: 0.4, alternateZoom: 1.08 }
    coldOpen: { enabled: true, length: 3s }
    punchIn: { amount: 0.15, on: [laughter, shout] }
    shake: { amplitude: 0.012, events: [kill] }
    sfx: { enabled: true, whooshVolume: 0.35, impactVolume: 0.5 }
    labels: { enabled: true }
    slowMo: { enabled: true, factor: 0.5, onlyStrong: true }
    captions: { model: models/ggml-large-v3-turbo-q5_0.bin, language: en, maxChars: 18 }
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  audio: mix
  formats: ["source", "9:16"]
  sourceHeight: 1080
  vertical:
    size: { width: 1080, height: 1920 }
    reference: { width: 854, height: 480 }
    hud:
      # Compteurs (éliminations du joueur et de l'escouade, joueurs restants) et mini-carte, recollés en haut.
      - name: counters
        source: { x: 0.80, y: 0.015, width: 0.065, height: 0.16 }
        target: { x: 0.60, y: 0.06, width: 0.16 }
      - name: minimap
        source: { x: 0.865, y: 0.015, width: 0.13, height: 0.225 }
        target: { x: 0.77, y: 0.06, width: 0.21 }

montage:
  # Le kill est la notification « KNOCKED! » (ou le compteur, sans mise à terre), vue juste après le tir : le tir est
  # recherché autour (son des tirs), comme pour les autres jeux.
  killOffset: -400ms
