id: lol
displayName: League of Legends

match:
  pathContains: ["League of Legends", "LeagueOfLegends"]
  priority: 10

# Les combats d'équipe durent 10 à 30 s : fenêtres plus larges.
window: { size: 2s, hop: 1s }

# Les pistes sont désignées par leur rôle : Outplayed en écrit trois (mix, jeu, micro), OBS une ou deux, et le bon
# choix se fait tout seul. Pour imposer des index : « audio: { game: 1, mic: 2 } » au niveau du profil.
detectors:
  - id: game-audio
    type: audio-loudness
    weight: 0.7
    normalization: { lowPercentile: 0.5, highPercentile: 0.98, minSpread: 10 }
    params: { role: game, localBaseline: 45s }

  - id: mic-audio
    type: audio-loudness
    weight: 0.3
    normalization: { lowPercentile: 0.8, highPercentile: 0.99, minSpread: 12 }
    params: { role: mic, optional: true }

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { role: mic, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { role: mic, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.55
  mergeGap: 6s
  preRoll: 4s
  postRoll: 2s
  minClip: 6s
  maxClip: 25s
  target: { totalDuration: 60s }

edit:
  # story : montage façon YouTube (temps morts coupés en jump cuts, accroche du meilleur moment en ouverture,
  # punch-in sur les rires et cris, secousse sur les kills, flash + whoosh entre les moments).
  # simple : les moments bout à bout, séparés par un fondu.
  style: story
  story:
    # Moments séparés de moins de 12 s : une seule scène, sans flash entre eux.
    scenes: { gap: 12s, maxLength: 45s }
    jumpCuts: { minGap: 1500ms, breath: 300ms, deadScore: 0.35, alternateZoom: 1.08 }
    coldOpen: { enabled: true, length: 3s }
    punchIn: { amount: 0.15, on: [laughter, shout] }
    shake: { amplitude: 0.012, events: [kill] }
    # Bruitages : variantes générées par défaut ; un dossier de sons (whooshDir, impactDir) les remplace, chacun à son tour.
    sfx: { enabled: true, whooshVolume: 0.35, impactVolume: 0.5 }
    # Libellés DOUBLÉ / TRIPLÉ… sur les séries de kills, et ralenti sur le pic des moments forts.
    labels: { enabled: true, multiKill: [DOUBLÉ, TRIPLÉ, QUADRUPLÉ, ACE] }
    slowMo: { enabled: true, factor: 0.5, onlyStrong: true }
    # Sous-titres de la voix (micro), transcrite en local par whisper.cpp. Sans le modèle, le montage sort sans
    # sous-titres. Modèle : https://huggingface.co/ggerganov/whisper.cpp (ggml-large-v3-turbo-q5_0.bin, ~574 Mo).
    captions: { model: models/ggml-large-v3-turbo-q5_0.bin, language: fr, maxChars: 18 }
    # Musique de fond facultative (chemin relatif au dossier de configuration), baissée sous la voix et coupée sur
    # le pic de chaque moment : music: { file: musique/fond.mp3, volume: 0.25 }
  order: chronological
  transition: { type: fade, duration: 300ms }
  loudnessLufs: -14
  # Son du montage : tout le son de la capture, sans doubler une piste qui contient déjà les autres.
  audio: mix
  # source = ratio de la capture (21:9 sur écran ultrawide).
  formats: ["source"]
  # Pour le 9:16, recadrage autour du centre de l'écran (le champion est centré caméra verrouillée).
  vertical:
    size: { width: 1080, height: 1920 }
