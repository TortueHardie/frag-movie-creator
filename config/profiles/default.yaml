# Profil utilisé quand aucun autre ne correspond au chemin du fichier.
id: default
displayName: Générique

window: { size: 2s, hop: 1s }

detectors:
  # Première piste audio : le son du jeu (ou le mix complet si une seule piste).
  - id: game-audio
    type: audio-loudness
    weight: 0.7
    normalization: { lowPercentile: 0.5, highPercentile: 0.98, minSpread: 10 }
    params: { stream: 0 }

  # Deuxième piste si elle existe (micro séparé). Absente = poids redistribué automatiquement.
  - id: mic-audio
    type: audio-loudness
    weight: 0.3
    normalization: { lowPercentile: 0.8, highPercentile: 0.99, minSpread: 12 }
    params: { stream: 1, optional: true }

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { stream: 1, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { stream: 1, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.55
  mergeGap: 4s
  preRoll: 3s
  postRoll: 2s
  minClip: 4s
  maxClip: 20s
  target: { totalDuration: 60s }

edit:
  order: chronological
  transition: { type: fade, duration: 300ms }
  loudnessLufs: -14
  formats: ["source"]
  fps: 60
