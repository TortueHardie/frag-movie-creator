id: valorant
displayName: VALORANT

match:
  pathContains: ["VALORANT"]
  priority: 10

# Kills brefs : fenêtres courtes pour localiser précisément le pic.
window: { size: 1s, hop: 500ms }

# Pistes Outplayed (mesuré sur Wardogs, même réglage supposé) : a:0 = mix jeu + voix, a:1 = jeu seul, a:2 = micro seul.
# Une capture à piste unique retombe sur a:0 pour le jeu.
detectors:
  - id: game-audio
    type: audio-loudness
    weight: 0.7
    normalization: { lowPercentile: 0.5, highPercentile: 0.98, minSpread: 10 }
    params: { stream: 1, fallbackStream: 0, localBaseline: 20s }

  - id: mic-audio
    type: audio-loudness
    weight: 0.3
    normalization: { lowPercentile: 0.8, highPercentile: 0.99, minSpread: 12 }
    params: { stream: 2, optional: true }

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { stream: 2, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { stream: 2, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 3s
  preRoll: 3s
  postRoll: 1500ms
  minClip: 4s
  maxClip: 15s
  target: { totalDuration: 60s }

edit:
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  # Montage : piste mix uniquement (les autres la composent déjà).
  audioStreams: [0]
  # source = ratio de la capture (21:9 sur écran ultrawide).
  formats: ["source"]
