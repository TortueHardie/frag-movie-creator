id: valorant
displayName: VALORANT

match:
  pathContains: ["VALORANT"]
  priority: 10

# Kills brefs : fenêtres courtes pour localiser précisément le pic.
window: { size: 1s, hop: 500ms }

# Les pistes sont désignées par leur rôle : Outplayed en écrit trois (mix, jeu, micro), OBS une ou deux, et le bon
# choix se fait tout seul. Pour imposer des index : « audio: { game: 1, mic: 2 } » au niveau du profil.
detectors:
  - id: game-audio
    type: audio-loudness
    weight: 0.7
    normalization: { lowPercentile: 0.5, highPercentile: 0.98, minSpread: 10 }
    params: { role: game, localBaseline: 20s }

  - id: mic-audio
    type: audio-loudness
    weight: 0.3
    normalization: { lowPercentile: 0.8, highPercentile: 0.99, minSpread: 12 }
    params: { role: mic, optional: true }

  # Événements du jeu enregistrés par Outplayed (transmis par VALORANT via Overwolf, sans analyse d'image) : kills,
  # morts, assistances, headshots. Absent si la capture ne vient pas d'Outplayed.
  # Vérifié sur une partie complète : 22 kills, 22 morts, 8 assistances, comme le tableau de fin.
  - id: game-events
    type: outplayed-events
    weight: 0
    eventBoosts: { kill: 0.8, assist: 0.3 }
    params:
      # clutch : annoncé par le jeu à la fin du round (4 parties sur 12, un par partie, comme le tableau de fin).
      kinds: { kill: kill, death: death, assist: assist, headshot: headshot, clutch: clutch }
      # Outplayed reçoit chaque événement après son apparition dans le killfeed : 0,39 s pour les kills (22 mesurés,
      # ±10 ms), 0,39 s en médiane pour les morts ; même retard supposé pour les assistances. Le clutch suit le kill
      # qui le conclut de 15 à 30 ms : même retard, pour qu'il reste après lui.
      offsets: { kill: -390ms, death: -390ms, assist: -390ms, headshot: -390ms, clutch: -390ms }

  # Sans Outplayed (capture OBS, ShadowPlay…), kills et morts sont lus dans le killfeed : le portrait du joueur y est
  # pris dans un cadre jaune, à gauche quand il tue, à droite quand il meurt, quels que soient l'agent, l'arme, le skin
  # ou le pseudo. Ne tourne que si game-events n'a rien donné : jamais deux fois les mêmes kills. Sans assistances ;
  # les headshots sont lus à part (headshot-icon, plus bas). Mesuré sur quatre parties (3440x1440 et 1920x1080, deux joueurs,
  # deux agents) : 79 kills sur 79, 58 morts sur 58, aucun faux positif. Coût : les images clés sont lues d'abord, puis
  # seuls les instants où une nouvelle ligne du joueur apparaît sont décodés (keyframeScan, voir le README).
  # Sous 720 px de haut (vidéos 480p de YouTube), le contour est délavé : l'aplat jaune du portrait est lu à la place
  # (fillBelow, voir le README) ; mesuré sur deux parties 854x480 en 16:9. Revérifié le 22/11 sur trois clips Outplayed
  # réels en 21:9 (2580x1080 et 1720x720, contour jaune pâle) : 9 kills sur 11, aucun faux, après avoir baissé les
  # bornes du cadre et limité la durée de vie d'une ligne (minHeight, minFill, lineLife : voir le README). Partie entière
  # 3440x1440 du 22/11 : morts 8 sur 8, kill 1 sur 1 ; lampes et enseigne jaunes du décor écartées (maxInside).
  - id: killfeed
    type: killfeed
    fallbackFor: game-events
    weight: 0
    eventBoosts: { kill: 0.8 }
    params:
      # Killfeed mesuré sur 3440x1440, collé au bord droit : la zone suit le format de la capture analysée.
      region: { x: 0.709302, y: 0.076389, width: 0.290698, height: 0.243056 }
      referenceWidth: 3440
      referenceHeight: 1440
      anchor: right
      # Ligne vue après son apparition (0,1 s en moyenne à 5 img/s, plus son affichage) : sur deux parties, 0,12 et
      # 0,23 s en médiane après les kills d'Outplayed recalés sur le killfeed (la troisième : 0,5 s avant).
      offset: -150ms

  # Confirmation de chaque kill à l'image : la même lecture du killfeed, toujours faite (avec ou sans Outplayed) et à
  # 30 img/s, émet « feed-kill » à l'apparition de chaque ligne du joueur. C'est l'instant où le jeu enregistre le kill :
  # 0,02 à 0,10 s après l'icône de kill sous le réticule (13 kills d'une partie du 30/09), quand Outplayed s'en écarte
  # de -0,55 à +0,47 s. Le montage y cale la balle qui tue (montage.killStyle.confirmEvent) : sans cela, un kill sur
  # trois commençait après le kill dans les plans d'un temps. Coût : environ 1 min 30 pour une partie de 30 min.
  - id: kill-confirm
    type: killfeed
    weight: 0
    params:
      fps: 30
      kinds: { kill: feed-kill }
      region: { x: 0.709302, y: 0.076389, width: 0.290698, height: 0.243056 }
      referenceWidth: 3440
      referenceHeight: 1440
      anchor: right

  # Tirs du joueur dans le son du jeu : les attaques les plus fortes de la partie (son arme ; tirs adverses, pas et
  # capacités arrivent atténués). Avec ou sans Outplayed, qui ne transmet pas les tirs : c'est ce qui désigne les kills
  # d'une seule balle (one taps). Mesuré sur deux parties : les rafales du Vandal (une balle toutes les 0,1 s) ne
  # redescendent que de 6 à 10 dB entre deux balles, une sur deux à quatre sur cinq y échappe ; deux sprays sur 23 kills
  # passaient pour des one taps. Les balles viennent donc du compteur de munitions (détecteur ammo, ci-dessous) ; ces
  # tirs entendus restent le recours sans compteur lisible.
  - id: game-shots
    type: game-sounds
    weight: 0
    params:
      shots: { minRiseDb: 9, percentile: 0.9, belowDb: 10 }

  # Balles tirées, lues sur le compteur de munitions du chargeur (les chiffres, à gauche de l'icône du chargeur ; zone
  # mesurée en 16:9, accrochée au centre) autour de chaque kill d'Outplayed ou du killfeed : c'est ce qui dit si un
  # kill s'est fait d'une seule balle (one tap), à la place des tirs entendus. Mesuré sur 16 parties en 3440x1440 :
  # 111 balles sur 111 retrouvées autour de 14 kills vérifiés à l'œil ; 5 vrais one taps sur 138 kills à la tête,
  # qu'aucun tir entendu ne désignait. Non vérifié en 16:9. Coût : 2 s de vidéo relues par kill.
  - id: ammo
    type: ammo-counter
    dependsOn: [game-events, killfeed]
    weight: 0
    params:
      region: { x: 0.650, y: 0.925, width: 0.050, height: 0.045 }

  # Tirs à la tête sans Outplayed : le son de l'impact à la tête, reconnu à son empreinte. Gabarit de 90 ms pris
  # 66 ms après un kill à la tête (partie du 25/09, 548,05 s, piste du jeu), le motif qui revenait le plus dans les
  # 9 headshots d'Outplayed de deux parties et le moins dans les 14 kills au corps. Mesuré autour des 23 kills : les
  # headshots montent à 0,72-0,78 (4 sur les 8 autres), les kills au corps plafonnent à 0,64. Seuil 0,7 : aucun faux
  # headshot, la moitié des vrais manqués (le son se perd dans la rafale). Revu le 19/11 sur les deux parties 854x480
  # du disque, comparé à l'icône du killfeed relue à l'image : 2 kills à la tête reconnus sur 27, et 4 kills au corps
  # dits à la tête (autant de faux one taps). Désactivé : l'icône du killfeed (headshot-icon) le remplace.
  - id: headshot-sound
    type: game-sounds
    enabled: false
    fallbackFor: game-events
    weight: 0
    params:
      shots: null
      sounds:
        headshot: { file: templates/valorant/headshot.wav, threshold: 0.7, minHz: 1000, maxHz: 12000 }

  # Tirs à la tête sans Outplayed, lus dans le killfeed : l'icône de la cible entre l'arme et la victime, présente sur
  # les lignes du joueur (revérifié le 19/11 sur deux parties 854x480, à l'image : 27 icônes sur 61 kills). Relit
  # 2 s autour de chaque kill. Bien plus sûr que le son (headshot-sound) : sur les deux parties, le son reconnaissait 2
  # headshots sur 27 et en inventait 4, l'icône 26 sur 27 sans faux (seuil 0,6). Avec Outplayed, ne relit rien. Gabarit
  # pris en 480p, agrandi : en 2580x1080 et 1720x720 (trois clips réels, 22/11), 4 headshots sur 4 des kills lus, aucun faux.
  - id: headshot-icon
    type: killfeed-headshot
    dependsOn: [game-events, killfeed]
    weight: 0
    params:
      template: templates/valorant/killfeed_headshot.png
      killfeed:
        region: { x: 0.709302, y: 0.076389, width: 0.290698, height: 0.243056 }
        referenceWidth: 3440
        referenceHeight: 1440
        anchor: right

  # Morts des alliés et des adversaires, à la couleur de la victime de chaque ligne du killfeed (sarcelle pour l'équipe
  # du joueur, rouge pour l'adversaire, lue juste avant son portrait) : c'est ce qui compte les alliés en vie dans un
  # round et reconnaît un vrai clutch sans Outplayed (montage.killStyle.allyDeathEvent). Avec Outplayed, c'est le jeu
  # qui annonce ses clutchs. Lit aussi les débuts de round (barres de vie alliées) et le bandeau « CLUTCH » de fin de
  # round (clutchs gagnés au spike). Lu seulement en secours, à 5 img/s, en décodage logiciel (le matériel ternit le cercle de
  # « Run it Back » de Phoenix, dont les morts sont écartées). Mesuré sur deux parties 854x480 (voir le README) et
  # sur trois clips réels 2580x1080 et 1720x720 (22/11) : 15 morts sur 16, aucune fausse. Partie entière 3440x1440
  # (22/11) : 71 morts sur 77, 14 fausses dues au décor ; les murs orange relus au rouge franc (enemyStrict).
  - id: teams
    type: killfeed-teams
    fallbackFor: game-events
    weight: 0
    params:
      region: { x: 0.709302, y: 0.076389, width: 0.290698, height: 0.243056 }
      referenceWidth: 3440
      referenceHeight: 1440
      anchor: right

  # Score des rounds, lu dans la barre du haut (équipe du joueur à gauche, adversaire à droite) : un événement
  # « round-won » ou « round-lost » par round, pour le bandeau de score du montage (montage.text.roundScore). Avec ou
  # sans Outplayed, qui ne transmet pas le score. 2 img/s en décodage logiciel (images clés si chaque seconde). Mesuré sur deux parties 854x480 :
  # 48 changements de score sur 48, aucun faux (voir le README) ; en 2580x1080 et 1720x720 (trois clips réels, 22/11) :
  # scores de départ et changement de score justes, aucun faux. Partie entière 3440x1440 (22/11, 9-4 à 13-10) :
  # 23 sur 23, aucun faux, une fois l'écart entre deux chiffres essayé à ±1 px (gapSlack).
  - id: score
    type: round-score
    weight: 0

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { role: mic, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { role: mic, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 3s
  preRoll: 3s
  postRoll: 1500ms
  minClip: 4s
  maxClip: 15s
  target: { totalDuration: 60s }

edit:
  # Webcam en incrustation (16:9, format source) : coin libre du HUD ; mini-carte en haut à gauche, killfeed en haut à droite, munitions en bas à droite : le bas gauche est libre.
  webcam: { corner: bottom-left }
  # story : montage façon YouTube (temps morts coupés en jump cuts, accroche du meilleur moment en ouverture,
  # punch-in sur les rires et cris, secousse sur les kills, flash + whoosh entre les moments).
  # simple : les moments bout à bout, séparés par un fondu.
  style: story
  story:
    # Rythme VALORANT : rounds courts et denses. Les kills d'un même round forment une seule scène (moins de 20 s
    # d'écart), sans flash entre eux ; on ne coupe que les vraies pauses (plus de 2,5 s), l'action est déjà rapide.
    scenes: { gap: 20s, maxLength: 45s }
    jumpCuts: { minGap: 2500ms, breath: 300ms, deadScore: 0.3, alternateZoom: 1.08 }
    coldOpen: { enabled: true, length: 3s }
    punchIn: { amount: 0.15, on: [laughter, shout] }
    shake: { amplitude: 0.012, events: [kill] }
    # Bruitages : variantes générées par défaut ; un dossier de sons (whooshDir, impactDir) les remplace, chacun à son tour.
    sfx: { enabled: true, whooshVolume: 0.35, impactVolume: 0.5 }
    # Libellés DOUBLÉ / TRIPLÉ… sur les séries de kills, et ralenti sur le pic des moments forts.
    labels: { enabled: true }
    slowMo: { enabled: true, factor: 0.5, onlyStrong: true }
    # Sous-titres de la voix (micro), transcrite en local par whisper.cpp. Sans le modèle, le montage sort sans
    # sous-titres. Modèle : https://huggingface.co/ggerganov/whisper.cpp (ggml-large-v3-turbo-q5_0.bin, ~574 Mo).
    # Répliques de l'annonceur, jamais sous-titrées quand seul le son complet est transcrit (capture sans piste micro,
    # withoutMic) : relevées par whisper sur « Valorant- 44 kills » et « Valorant_game » (« Enemies spotted », « Spike
    # down, attacker spawned », « One enemy remains », « Ultimates ready ») ; « Bravo! », « Attention ! », « Vous pensiez
    # que... » ajoutés au choix du joueur (voix de personnages). Sur la piste micro, rien n'est écarté.
    captions:
      model: models/ggml-large-v3-turbo-q5_0.bin
      language: fr
      maxChars: 18
      ignore: [enemy, enemies, ennemi, ennemis, spotted, spike, attacker, attackers, defender, defenders, remaining, remains, ultimate, ultimates, bravo, attention, vous pensiez]
    # Musique de fond facultative (chemin relatif au dossier de configuration), baissée sous la voix et coupée sur
    # le pic de chaque moment : music: { file: musique/fond.mp3, volume: 0.25 }
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  # Son du montage : tout le son de la capture, sans doubler une piste qui contient déjà les autres.
  audio: mix
  # source = ratio de la capture (21:9 sur écran ultrawide).
  formats: ["source"]
  # Vertical 9:16 : le recadrage au centre ne gardait que le milieu du bandeau du haut (score, minuteur), les avatars
  # des deux équipes coupés sur les côtés. Le recadrage part donc sous le bandeau (y 0,09 : il ne s'y voit plus), et le
  # bandeau entier est replacé en haut, sur toute la largeur. Mesuré sur une capture 16:9 ; centré, il garde sa taille
  # en pixels en 21:9 (ScreenGeometry).
  # Même chose en bas : le bloc vie, armure, capacités et munitions (x 0,27 à 0,73, y 0,89 à 0,995, mesuré sur
  # « Valorant- 44 kills » en 16:9) était rogné sur les côtés. Le recadrage s'arrête au-dessus de lui (y 0,885), et le
  # bloc entier est replacé en bas, dans la zone sûre des applications verticales (marges de 5 % à gauche, 14 % à
  # droite, 22 % en bas : TikTok). Bandeau et bloc restent fixes pendant les zooms (HudPin). Le réticule tombe alors à
  # 1,6 % sous le centre de l'image verticale.
  vertical:
    size: { width: 1080, height: 1920 }
    reference: { width: 1920, height: 1080 }
    cropRegion: { x: 0.0, y: 0.09, width: 1.0, height: 0.795 }
    # Les zooms (punch-in + approche : ×1,43 au plus) visent sous le réticule : l'icône du kill (y 0,74 à 0,835 de la
    # capture, mesuré sur 12 kills) reste entière dans l'image, sous le bloc replacé ; le réticule remonte à ~0,39.
    # Visés sur le réticule, le recadrage ne pouvant s'agrandir sans montrer bandeau ou bloc en double, le crâne sortait
    # par le bas.
    zoomFocus: 0.726
    hud:
      - name: topbar
        source: { x: 0.20, y: 0.008, width: 0.60, height: 0.080 }
        target: { x: 0.0, y: 0.0, width: 1.0 }
        anchor: center
      - name: abilities
        source: { x: 0.27, y: 0.89, width: 0.46, height: 0.105 }
        target: { x: 0.05, y: 0.72, width: 0.81 }
        anchor: center

montage:
  # Les instants des kills sont déjà corrigés du retard d'Outplayed (offsets de game-events) : rien à compenser.
  killOffset: 0ms
  # Kills à la capacité (molly, flèche, drone…) écartés : la cible meurt hors du réticule, rien de lisible à l'image.
  # Reconnus à l'absence de balle sur le compteur de munitions (ammo-counter) ; aucun kill à l'arme écarté sur 61
  # mesurés (deux parties 854x480). Les statistiques et la recherche les gardent.
  skipAbilityKills: true
  # Les clutchs annoncés par le jeu (game-events), plutôt que déduits : la déduction en comptait 3 pour 1 réel.
  killStyle:
    clutchEvent: clutch
    # Kills confirmés par le killfeed (détecteur kill-confirm) : la balle qui tue est cherchée juste avant.
    confirmEvent: feed-kill
  # Raccords sur la pose de l'arme : dans VALORANT, on tire à la hanche, l'arme immobile en bas à droite. Une coupe
  # se raccorde quand les deux plans tiennent la même arme de la même façon : elle reste en place, le décor change.
  # Zone serrée sur l'arme (mesurée en 16:9), comparée en entier : au kill, l'arme tremble sous le recul et ce sont
  # ses pixels, pas ceux du décor, qu'il faut garder. Pas de symétrie attendue (ce n'est pas une visée). Poses
  # semblables exigées : 0,7 à 0,8 entre deux pistolets, 0,5 à 0,7 entre deux fusils, 0,3 au plus sinon.
  matchCut:
    region: { x: 0.634, y: 0.60, width: 0.363, height: 0.40 }
    pose: rest
    stillShare: 1.0
    minSymmetry: -1.0
    minPoseMatch: 0.5
    # Arme à feu en main : l'icône du chargeur, entre les munitions et la réserve. Absente avec une capacité ou le
    # couteau en main, tenus au même endroit qu'une arme. Mesuré : 0,86 à 1 avec une arme, 0,68 au plus sans.
    weapon:
      template: templates/valorant/ammo_icon.png
      region: { x: 0.678, y: 0.925, width: 0.04, height: 0.045 }
      width: 64
      height: 40
      minScore: 0.8
