id: valorant
displayName: VALORANT

match:
  pathContains: ["VALORANT"]
  priority: 10

# Kills brefs : fenêtres courtes pour localiser précisément le pic.
window: { size: 1s, hop: 500ms }

# Les pistes sont désignées par leur rôle : Outplayed en écrit trois (mix, jeu, micro), OBS une ou deux, et le bon
# choix se fait tout seul. Pour imposer des index : « audio: { game: 1, mic: 2 } » au niveau du profil.
detectors:
  - id: game-audio
    type: audio-loudness
    weight: 0.7
    normalization: { lowPercentile: 0.5, highPercentile: 0.98, minSpread: 10 }
    params: { role: game, localBaseline: 20s }

  - id: mic-audio
    type: audio-loudness
    weight: 0.3
    normalization: { lowPercentile: 0.8, highPercentile: 0.99, minSpread: 12 }
    params: { role: mic, optional: true }

  # Événements du jeu enregistrés par Outplayed (transmis par VALORANT via Overwolf, sans analyse d'image) : kills,
  # morts, assistances, headshots. Absent si la capture ne vient pas d'Outplayed.
  # Vérifié sur une partie complète : 22 kills, 22 morts, 8 assistances, comme le tableau de fin.
  - id: game-events
    type: outplayed-events
    weight: 0
    eventBoosts: { kill: 0.8, assist: 0.3 }
    params:
      kinds: { kill: kill, death: death, assist: assist, headshot: headshot }
      # Outplayed reçoit chaque événement après son apparition dans le killfeed : 0,39 s pour les kills (22 mesurés,
      # ±10 ms), 0,39 s en médiane pour les morts ; même retard supposé pour les assistances.
      offsets: { kill: -390ms, death: -390ms, assist: -390ms, headshot: -390ms }

  # Sans Outplayed (capture OBS, ShadowPlay…), kills et morts sont lus dans le killfeed : le portrait du joueur y est
  # pris dans un cadre jaune, à gauche quand il tue, à droite quand il meurt, quels que soient l'agent, l'arme, le skin
  # ou le pseudo. Ne tourne que si game-events n'a rien donné : jamais deux fois les mêmes kills. Sans assistances ni
  # headshots (absents du killfeed pour le joueur). Mesuré sur quatre parties (3440x1440 et 1920x1080, deux joueurs,
  # deux agents) : 79 kills sur 79, 58 morts sur 58, aucun faux positif. Coût : les images clés sont lues d'abord, puis
  # seuls les instants où une nouvelle ligne du joueur apparaît sont décodés (keyframeScan, voir le README).
  - id: killfeed
    type: killfeed
    fallbackFor: game-events
    weight: 0
    eventBoosts: { kill: 0.8 }
    params:
      # Killfeed mesuré sur 3440x1440, collé au bord droit : la zone suit le format de la capture analysée.
      region: { x: 0.709302, y: 0.076389, width: 0.290698, height: 0.243056 }
      referenceWidth: 3440
      referenceHeight: 1440
      anchor: right
      # Ligne vue après son apparition (0,1 s en moyenne à 5 img/s, plus son affichage) : sur deux parties, 0,12 et
      # 0,23 s en médiane après les kills d'Outplayed recalés sur le killfeed (la troisième : 0,5 s avant).
      offset: -150ms

  # Tirs du joueur dans le son du jeu : les attaques les plus fortes de la partie (son arme ; tirs adverses, pas et
  # capacités arrivent atténués). Avec ou sans Outplayed, qui ne transmet pas les tirs : c'est ce qui dit si un kill
  # s'est fait d'une seule balle (one tap). Réglages non encore mesurés sur de vraies parties.
  - id: game-shots
    type: game-sounds
    weight: 0
    params:
      shots: { minRiseDb: 9, percentile: 0.9, belowDb: 10 }

  # Tirs à la tête sans Outplayed : le son de l'impact à la tête, reconnu à son empreinte. Le gabarit est à extraire
  # une fois d'une capture, au ras du début du son, par exemple :
  #   ffmpeg -ss 754.32 -t 0.25 -i partie.mp4 -map 0:a:0 -ac 1 config/templates/valorant/headshot.wav
  # Sans ce fichier, le détecteur le signale et ne cherche rien.
  - id: headshot-sound
    type: game-sounds
    fallbackFor: game-events
    weight: 0
    params:
      shots: null
      sounds:
        headshot: { file: templates/valorant/headshot.wav, threshold: 0.75, minHz: 1000, maxHz: 12000 }

  # Prises de parole sur la piste micro : un moment n'est jamais coupé au milieu d'une phrase ou d'un rire.
  - id: voice
    type: voice-activity
    weight: 0
    params: { role: mic, optional: true, silenceDb: -50 }

  # Rires et exclamations sur le micro (IA locale YAMNet) : deviennent des moments à garder, et ne sont jamais coupés.
  - id: reactions
    type: audio-events
    weight: 0
    eventBoosts: { laughter: 0.7, shout: 0.35 }
    params: { role: mic, optional: true }

selection:
  # Types de segments jamais coupés : le moment s'étend (jusqu'à maxExtension) pour finir la phrase ou le rire.
  keepWhole: [speech, laughter]
  maxExtension: 8s
  threshold: 0.6
  mergeGap: 3s
  preRoll: 3s
  postRoll: 1500ms
  minClip: 4s
  maxClip: 15s
  target: { totalDuration: 60s }

edit:
  # story : montage façon YouTube (temps morts coupés en jump cuts, accroche du meilleur moment en ouverture,
  # punch-in sur les rires et cris, secousse sur les kills, flash + whoosh entre les moments).
  # simple : les moments bout à bout, séparés par un fondu.
  style: story
  story:
    # Rythme VALORANT : rounds courts et denses. Les kills d'un même round forment une seule scène (moins de 20 s
    # d'écart), sans flash entre eux ; on ne coupe que les vraies pauses (plus de 2,5 s), l'action est déjà rapide.
    scenes: { gap: 20s, maxLength: 45s }
    jumpCuts: { minGap: 2500ms, breath: 300ms, deadScore: 0.3, alternateZoom: 1.08 }
    coldOpen: { enabled: true, length: 3s }
    punchIn: { amount: 0.15, on: [laughter, shout] }
    shake: { amplitude: 0.012, events: [kill] }
    # Bruitages : variantes générées par défaut ; un dossier de sons (whooshDir, impactDir) les remplace, chacun à son tour.
    sfx: { enabled: true, whooshVolume: 0.35, impactVolume: 0.5 }
    # Libellés DOUBLÉ / TRIPLÉ… sur les séries de kills, et ralenti sur le pic des moments forts.
    labels: { enabled: true, multiKill: [DOUBLÉ, TRIPLÉ, QUADRUPLÉ, ACE] }
    slowMo: { enabled: true, factor: 0.5, onlyStrong: true }
    # Sous-titres de la voix (micro), transcrite en local par whisper.cpp. Sans le modèle, le montage sort sans
    # sous-titres. Modèle : https://huggingface.co/ggerganov/whisper.cpp (ggml-large-v3-turbo-q5_0.bin, ~574 Mo).
    captions: { model: models/ggml-large-v3-turbo-q5_0.bin, language: fr, maxChars: 18 }
    # Musique de fond facultative (chemin relatif au dossier de configuration), baissée sous la voix et coupée sur
    # le pic de chaque moment : music: { file: musique/fond.mp3, volume: 0.25 }
  order: chronological
  transition: { type: fade, duration: 250ms }
  loudnessLufs: -14
  # Son du montage : tout le son de la capture, sans doubler une piste qui contient déjà les autres.
  audio: mix
  # source = ratio de la capture (21:9 sur écran ultrawide).
  formats: ["source"]

montage:
  # Les instants des kills sont déjà corrigés du retard d'Outplayed (offsets de game-events) : rien à compenser.
  killOffset: 0ms
  # Raccords sur la pose de l'arme : dans VALORANT, on tire à la hanche, l'arme immobile en bas à droite. Une coupe
  # se raccorde quand les deux plans tiennent la même arme de la même façon : elle reste en place, le décor change.
  # Zone serrée sur l'arme (mesurée en 16:9), comparée en entier : au kill, l'arme tremble sous le recul et ce sont
  # ses pixels, pas ceux du décor, qu'il faut garder. Pas de symétrie attendue (ce n'est pas une visée). Poses
  # semblables exigées : 0,7 à 0,8 entre deux pistolets, 0,5 à 0,7 entre deux fusils, 0,3 au plus sinon.
  matchCut:
    region: { x: 0.634, y: 0.60, width: 0.363, height: 0.40 }
    pose: rest
    stillShare: 1.0
    minSymmetry: -1.0
    minPoseMatch: 0.5
    # Arme à feu en main : l'icône du chargeur, entre les munitions et la réserve. Absente avec une capacité ou le
    # couteau en main, tenus au même endroit qu'une arme. Mesuré : 0,86 à 1 avec une arme, 0,68 au plus sans.
    weapon:
      template: templates/valorant/ammo_icon.png
      region: { x: 0.678, y: 0.925, width: 0.04, height: 0.045 }
      width: 64
      height: 40
      minScore: 0.8
