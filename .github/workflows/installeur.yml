name: Installeur

# Construit l'installeur Windows (MSI) et la version portable (ZIP) sur une machine neuve : FFmpeg est téléchargé par
# le build, rien n'est supposé installé. Un tag « v1.2.3 » publie les deux fichiers dans une release GitHub, d'où
# n'importe qui peut les télécharger.
# Les machines Windows comptent double en minutes Actions : le build tourne sur master, sur les tags, sur les pull
# requests, et à la demande (onglet Actions → « Exécuter le workflow ») plutôt qu'à chaque push de chaque branche.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: installeur-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage produit un MSI avec WiX 3 ; l'image du runner ne le fournit pas toujours.
      - name: WiX 3 (requis par jpackage)
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX déjà présent : $((Get-Command candle.exe).Source)"
          } else {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX 3 introuvable après installation" }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')
          }

      # Numéro de version : celui du tag (v1.2.3 → 1.2.3), sinon celui de gradle.properties.
      - name: Version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          Add-Content -Path $env:GITHUB_ENV -Value "HIGHLIGHTS_VERSION=$version"

      # FFmpeg livré avec l'application, téléchargé par le build : les tests s'exécutent contre ce binaire-là.
      - name: FFmpeg
        shell: pwsh
        run: |
          $extra = if ($env:HIGHLIGHTS_VERSION) { @("-Phighlights.version=$env:HIGHLIGHTS_VERSION") } else { @() }
          & .\gradlew.bat @('--no-daemon', ':app-ui:prepareBundledResources') @extra
          if ($LASTEXITCODE -ne 0) { throw "prepareBundledResources : code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path 'app-ui\build\appResources\windows\ffmpeg')

      - name: Tests
        shell: pwsh
        run: |
          $extra = if ($env:HIGHLIGHTS_VERSION) { @("-Phighlights.version=$env:HIGHLIGHTS_VERSION") } else { @() }
          & .\gradlew.bat @('--no-daemon', 'test') @extra
          if ($LASTEXITCODE -ne 0) { throw "tests : code $LASTEXITCODE" }

      - name: Installeur et version portable
        shell: pwsh
        run: |
          $extra = if ($env:HIGHLIGHTS_VERSION) { @("-Phighlights.version=$env:HIGHLIGHTS_VERSION") } else { @() }
          & .\gradlew.bat @('--no-daemon', ':app-ui:packageMsi', ':app-ui:portableZip') @extra
          if ($LASTEXITCODE -ne 0) { throw "empaquetage : code $LASTEXITCODE" }

      - name: Rassembler les fichiers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installeur | Out-Null
          Copy-Item app-ui\build\compose\binaries\main\msi\*.msi installeur\
          Copy-Item app-ui\build\distributions\*-portable.zip installeur\
          Get-ChildItem installeur | ForEach-Object { "{0} : {1:N0} octets" -f $_.Name, $_.Length }

      # L'installeur livré est installé puis désinstallé pour de vrai : on ne publie pas un MSI qui ne s'installe pas.
      # Le cycle complet (mise à jour, réinstallation, raccourcis) est dans le workflow « Vérifier l'installeur ».
      - name: Essai d'installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem installeur\*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v essai-installation.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content essai-installation.log -Tail 40 | ForEach-Object { Write-Host $_ }
            throw "Installation de $($msi.Name) : code $($p.ExitCode)"
          }
          # L'entrée de désinstallation est cherchée dans les trois emplacements possibles : par utilisateur (HKCU)
          # ou pour la machine (HKLM), et la clé n'existe pas forcément avant une première installation.
          $entrees = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          ) | Where-Object { Test-Path $_ } | ForEach-Object {
            $ruche = $_
            Get-ChildItem $ruche | ForEach-Object {
              Get-ItemProperty $_.PSPath | Add-Member -NotePropertyName Ruche -NotePropertyValue $ruche -PassThru
            }
          } | Where-Object { $_.DisplayName -like 'Highlights*' }

          $entrees = @($entrees)
          if ($entrees.Count -ne 1) { throw "Entrées « Applications installées » : $($entrees.Count) au lieu d'une" }
          $entree = $entrees[0]
          $dossier = if ($entree.InstallLocation) { $entree.InstallLocation } else { Join-Path $env:LOCALAPPDATA 'Highlights' }
          if (-not (Test-Path (Join-Path $dossier 'Highlights.exe'))) { throw "Highlights.exe absent de $dossier" }
          Write-Host "Installé dans $dossier, version $($entree.DisplayVersion)"
          Write-Host "Enregistré dans $($entree.Ruche)"

          $p = Start-Process msiexec.exe -ArgumentList "/x $($entree.PSChildName) /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Désinstallation : code $($p.ExitCode)" }
          if (Test-Path (Join-Path $dossier 'Highlights.exe')) { throw "Fichiers encore présents après désinstallation" }
          Write-Host "Installation puis désinstallation vérifiées"

      - uses: actions/upload-artifact@v4
        with:
          name: highlights-installeur
          path: installeur/*
          if-no-files-found: error

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:HIGHLIGHTS_VERSION
          $notes = @"
          Installation : télécharger Highlights-$version.msi et double-cliquer. L'installation se fait dans le profil de
          l'utilisateur, sans droits administrateur. Windows 10 ou 11 64 bits.

          Windows affiche un avertissement SmartScreen (l'installeur n'est pas signé) : « Informations complémentaires »
          puis « Exécuter quand même ».

          Mise à jour : lancer simplement le MSI de la nouvelle version, il remplace l'installation existante sans
          créer de seconde entrée. Désinstallation : Paramètres Windows → Applications installées → Highlights.
          Les montages et les profils modifiés sont conservés dans les deux cas.

          Highlights-$version-portable.zip est la même application sans installation : décompresser et lancer
          Highlights\Highlights.exe.

          Tout est inclus : Java, FFmpeg, le modèle YAMNet et les profils de jeu.
          "@
          $fichiers = Get-ChildItem installeur | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @fichiers --title "Highlights $version" --notes $notes
