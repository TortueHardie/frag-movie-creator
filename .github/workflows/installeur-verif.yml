name: Vérifier l'installeur

# Installe réellement l'application sur une machine Windows, l'installe à nouveau dans une version plus récente, puis
# la désinstalle, en vérifiant à chaque étape l'état du système : une seule entrée dans « Applications installées »,
# les fichiers de la nouvelle version en place, et plus rien après désinstallation.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    tags: ['v*']

concurrency:
  group: installeur-verif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle-de-vie:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX 3 (requis par jpackage)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX 3 introuvable après installation" }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')
          }

      # Ce que jpackage génère par défaut : sert à savoir quels réglages de mise à jour sont déjà en place.
      - name: Gabarits WiX de jpackage
        shell: pwsh
        run: |
          @'
          import java.nio.file.*;
          public class Dump {
              public static void main(String[] a) throws Exception {
                  FileSystem fs = FileSystems.getFileSystem(java.net.URI.create("jrt:/"));
                  Path base = fs.getPath("/modules/jdk.jpackage/jdk/jpackage/internal/resources");
                  for (Path p : Files.newDirectoryStream(base, "*.wx*")) {
                      System.out.println("=== " + p.getFileName());
                      Files.readAllLines(p).forEach(System.out::println);
                  }
              }
          }
          '@ | Set-Content -Path Dump.java -Encoding utf8
          java Dump.java

      - name: Construire deux versions de l'installeur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path msi | Out-Null

          function Empaqueter($version, $cible) {
            $sortie = 'app-ui\build\compose\binaries\main\msi'
            Remove-Item $sortie -Recurse -Force -ErrorAction SilentlyContinue
            # Argument passé dans un tableau : PowerShell couperait « -Phighlights.version=… » en deux sinon.
            & .\gradlew.bat @('--no-daemon', ':app-ui:packageMsi', "-Phighlights.version=$version")
            if ($LASTEXITCODE -ne 0) { throw "packageMsi $version : code $LASTEXITCODE" }
            $msi = Get-ChildItem "$sortie\*.msi" | Select-Object -First 1
            if (-not $msi) { throw "Aucun MSI produit pour la version $version" }
            Copy-Item $msi.FullName $cible
          }

          Empaqueter '9.9.8' 'msi\ancienne.msi'
          Empaqueter '9.9.9' 'msi\nouvelle.msi'
          Get-ChildItem msi | ForEach-Object { "{0} : {1:N0} octets" -f $_.Name, $_.Length }

      - name: Installer, mettre à jour, désinstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Entrees {
            $chemins = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            $chemins | Where-Object { Test-Path $_ } | ForEach-Object {
              Get-ChildItem $_ | ForEach-Object { Get-ItemProperty $_.PSPath }
            } | Where-Object { $_.DisplayName -like 'Highlights*' }
          }

          # jpackage ne renseigne pas toujours InstallLocation : repli sur l'emplacement par défaut d'une installation
          # par utilisateur.
          function Dossier($entree) {
            if ($entree.InstallLocation) { return $entree.InstallLocation }
            return (Join-Path $env:LOCALAPPDATA 'Highlights')
          }

          function Installer($fichier, $journal) {
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$fichier`" /qn /l*v $journal" -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $journal -Tail 40 | ForEach-Object { Write-Host $_ }
              throw "Installation de $fichier : code $($p.ExitCode)"
            }
          }

          Write-Host '--- installation de la 9.9.8'
          Installer (Resolve-Path msi\ancienne.msi) 'install-ancienne.log'
          $apres = @(Entrees)
          $apres | Format-List DisplayName, DisplayVersion, InstallLocation, PSChildName | Out-String | Write-Host
          if ($apres.Count -ne 1) { throw "Après la première installation : $($apres.Count) entrée(s) au lieu d'une" }
          $dossier = Dossier $apres[0]
          if (-not (Test-Path (Join-Path $dossier 'Highlights.exe'))) { throw "Highlights.exe absent de $dossier" }
          Write-Host "Installé dans $dossier, version $($apres[0].DisplayVersion)"

          Write-Host '--- mise à jour vers la 9.9.9'
          Installer (Resolve-Path msi\nouvelle.msi) 'install-nouvelle.log'
          $apres = @(Entrees)
          $apres | Format-List DisplayName, DisplayVersion, InstallLocation, PSChildName | Out-String | Write-Host
          if ($apres.Count -ne 1) { throw "Après la mise à jour : $($apres.Count) entrées, l'application est installée en double" }
          if ($apres[0].DisplayVersion -ne '9.9.9') { throw "Version installée : $($apres[0].DisplayVersion) au lieu de 9.9.9" }
          if (-not (Test-Path (Join-Path (Dossier $apres[0]) 'Highlights.exe'))) { throw "Highlights.exe absent après mise à jour" }
          Write-Host "Mise à jour en place : une seule entrée, version $($apres[0].DisplayVersion)"

          Write-Host '--- réinstallation de la même version (téléchargement refait, installeur relancé)'
          Installer (Resolve-Path msi\nouvelle.msi) 'install-meme-version.log'
          $apres = @(Entrees)
          $apres | Format-List DisplayName, DisplayVersion, PSChildName | Out-String | Write-Host
          if ($apres.Count -ne 1) { throw "Après réinstallation de la même version : $($apres.Count) entrées" }
          Write-Host "Réinstallation sans doublon : une seule entrée"

          Write-Host '--- raccourcis'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Highlights\Highlights.lnk'
          $bureau = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Highlights.lnk'
          if (-not (Test-Path $menu)) { throw "Raccourci du menu Démarrer absent : $menu" }
          if (-not (Test-Path $bureau)) { throw "Raccourci du bureau absent : $bureau" }
          Write-Host "Raccourcis en place : menu Démarrer et bureau"

          Write-Host '--- désinstallation'
          $code = $apres[0].PSChildName
          $dossier = Dossier $apres[0]
          $p = Start-Process msiexec.exe -ArgumentList "/x $code /qn /l*v desinstallation.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content desinstallation.log -Tail 40 | ForEach-Object { Write-Host $_ }
            throw "Désinstallation : code $($p.ExitCode)"
          }
          $restant = @(Entrees)
          if ($restant.Count -ne 0) { throw "Après désinstallation : $($restant.Count) entrée(s) restante(s)" }
          if (Test-Path (Join-Path $dossier 'Highlights.exe')) { throw "Fichiers encore présents dans $dossier" }
          if (Test-Path $menu) { throw "Raccourci du menu Démarrer encore présent" }
          if (Test-Path $bureau) { throw "Raccourci du bureau encore présent" }
          Write-Host "Désinstallation propre : plus d'entrée, plus de fichiers, plus de raccourcis"

      - name: Journaux d'installation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-msi
          path: '*.log'
          if-no-files-found: ignore
