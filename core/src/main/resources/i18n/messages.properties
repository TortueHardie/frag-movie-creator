# Highlights - English (base language, fallback for any missing key).
#
# How to translate: copy this file to messages_<tag>.properties (fr, de, pt_BR, zh_CN...) in the same folder,
# UTF-8, and translate the values. Keep every {placeholder} exactly as is. Keys ending in .one/.few/.many/.other are
# plural forms chosen from {count}: provide the forms your plural.rule needs (.other is always required).
# Glossary (keep in English unless your gaming community says otherwise): kill, headshot, ace, clutch, one tap,
# highlights, montage, beat drop, whip pan, K/D, HS.

language.name=English
# Plural family: one (en, de, es, it, nl, tr...), zero-one (fr, pt_BR), east-slavic (ru, uk), polish, czech, none (ja, ko, zh).
plural.rule=one

