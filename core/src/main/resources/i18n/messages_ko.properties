# Frise du plan de montage (atelier editeur-kills)
error.montage.edit.badKill=킬을 알아볼 수 없습니다: "{text}" (녹화@시간 형식, 예: match.mp4@3:12.4)
error.montage.edit.notFound={kill}에 킬이 없습니다: 녹화 이름과 시간을 확인하세요
error.montage.edit.conflict={kill}에 대한 수정이 서로 맞지 않습니다: 클립은 빼기, 강제로 넣기, 고정하기 중 하나만 할 수 있습니다
error.montage.edit.twoDrops=드롭에는 클립 하나만 고정할 수 있습니다
error.montage.edit.notPlaced={kill}을 넣을 자리가 없습니다: 남긴 클립을 모두 넣기엔 몽타주가 너무 짧습니다 (최대 길이를 늘리거나 덜 남기세요)
error.montage.edit.noDrop={kill}을 드롭에 고정할 수 없습니다: 이 부분에는 드롭이 없습니다
error.montage.edit.dropMissed={kill}을 드롭에 넣을 수 없습니다: 시간순으로는 그 앞 클립들이 드롭 전에 들어가지 않습니다
error.montage.edit.pinOutside={kill}을 {time}에 고정할 수 없습니다: 곡의 그 부분은 몽타주에 없습니다
error.montage.edit.pinMissed={kill}을 {time} 박자에 넣을 수 없습니다: 다른 클립이 이미 쓰고 있습니다
error.montage.edit.allExcluded=모든 킬을 뺐습니다: 몽타주로 만들 것이 없습니다
error.montage.noDeaths=이 경기들에서 데스를 찾지 못했습니다. 데스 몽타주를 만들 수 없습니다. 데스는 킬피드(VALORANT)에서 읽으며, Wardogs의 다운은 montage.killStyle.downedAsDeath가 켜져 있을 때만 셉니다.
error.montage.noReactions=이 게임들에서 마이크 리액션을 찾지 못했습니다. 리액션 몽타주를 만들 수 없습니다.
error.montage.noMicTrack=이 녹화에는 별도의 마이크 트랙이 없습니다. 리액션 몽타주는 목소리가 별도 트랙에 녹음되어 있어야 합니다(Outplayed와 OBS로 녹음할 수 있습니다).
error.thumbnail.noReport={file} 옆에 내보내기 보고서가 없습니다. 썸네일에는 영상과 함께 저장된 보고서가 필요합니다.
error.thumbnail.noSource={file}의 녹화 파일이 내보낸 위치에 더 이상 없습니다. 썸네일 이미지를 만들 수 없습니다.
