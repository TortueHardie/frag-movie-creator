# Vérité terrain relevée à l'œil sur le compteur d'éliminations du joueur (haut droite), image par image autour de
# chaque changement : planche output/revue/fortnite/verite_compteur_*.png. Instants = première image où le compteur
# affiche la nouvelle valeur (à la seconde près), soit l'élimination créditée, pas la mise à terre. Une équipe éliminée
# d'un coup donne plusieurs kills au même instant (00:39 : 0 → 4). Les trois parties finissent à 11, 13 et 7 (écran de
# fin vérifié) : 31 éliminations du joueur. Le titre de la vidéo (« 81 ») compte l'escouade entière (second compteur).
# Mises à terre (« KNOCKED! ») non relevées : elles ne sont pas dans kinds.
# Depuis le 19/11, deux sortes : « elimination » = l'instant où le compteur monte (31, relevé ci-dessus) ;
# « kill » = le moment du kill choisi par le joueur (« mettre à terre, c'est le kill ») : la notification « KNOCKED! »
# que l'élimination achève, sinon l'instant du compteur (équipe éliminée d'un coup, adversaire éliminé sans mise à
# terre). 33 kills : 31 éliminations, dont 15 ramenées à leur mise à terre, plus 2 mises à terre jamais créditées
# (11:33, et la dernière avant « Victory Royale » à 27:22). Vérifié à l'œil : chaque « KNOCKED! » (planche
# output/revue/fortnite/knocks_detectes.jpg) et l'absence de notification avant les éliminations sans mise à terre
# (eliminations_sans_knock.jpg). Les mises à terre elles-mêmes ne sont pas une sorte relevée (pas dans kinds).
