# toute la capture (planches dans output/revue/apex/). Trois parties : 20, 23 et 13 kills, soit 56 (le titre de la
# vidéo dit 53). Chaque événement est l'instant où le compteur monte ; quand il monte de 2 ou 3 d'un coup (« SQUAD
