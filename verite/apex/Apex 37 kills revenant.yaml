# Vérité terrain : crédits du compteur de kills du HUD (en haut à droite, tête de mort), lus à l'œil à 1 img/s sur
# toute la capture (planches dans output/revue/apex/revenant_compteur_*.png). Une seule partie : 36 kills (le titre de
# la vidéo dit 37). Chaque événement est l'instant où le compteur monte ; quand il monte de 2 d'un coup (« SQUAD WIPE »),
# deux événements au même instant. Pas de mort du joueur à l'écran ; les « knock » ne sont pas relevés.
# Capture : compilation YouTube réencodée en 854x480, image teintée et montée, même chaîne que « Apex 53 kills octane ».
capture: { name: Apex 37 kills revenant.mp4, sizeBytes: 179771677, duration: 1145.092s }
profile: apex
# Avant le calage des « SQUAD WIPE » (credits, branche apex-calage), il fallait 5 s de tolérance : la notification
